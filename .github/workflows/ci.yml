name: CI

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest    

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          prune-cache: false
          
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Start backend
        working-directory: backend
        run: nohup uv run uvicorn main:app --port 8000 > server.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is up!"
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done
          echo "Backend failed to start. Logs:"
          cat backend/server.log
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        working-directory: test
        run: mvn test
